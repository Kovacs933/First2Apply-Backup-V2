name: Build All Projects

# Manual only: builds every app inherited from First 2 Apply (blog, landing page, ...), which
# Foundation doesn't use, so running it on every push would just send failure emails.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Build all projects
        run: |
          pnpm build
